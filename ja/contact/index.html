<script>
function switchSiteLang(lang){const p=location.pathname;const m=p.match(/^\/(ja|es|de|fr|pt)(\/.*)?$/);const rest=m?(m[2]||'/'):p;let page='';if(rest==='/'||rest==='/index.html')page='';else{const sm=rest.match(/^\/(results|matchup|contact|about|disclaimer|privacy-policy)(?:\.html|\/)?$/);if(sm)page=sm[1];else page='';}if(lang==='en'){location.href=page?`/${page}.html`:'/';return;}location.href=page?`/${lang}/${page}/`:`/${lang}/`;}
(function(){const m=location.pathname.match(/^\/(ja|es|de|fr|pt)(?:\/|$)/);const lang=m?m[1]:'en';document.querySelectorAll('.lang-switcher').forEach(s=>{s.value=lang;});})();
